function translateRendered(){
  const map=UI[state.lang]||{};
  const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
  let n;
  while(n){
    const raw=n.nodeValue, key=raw.trim();
    if(key&&map[key]) n.nodeValue=raw.replace(key,map[key]);
    n=walker.nextNode();
  }
  document.querySelectorAll("[placeholder]").forEach(el=>{if(map[el.placeholder])el.placeholder=map[el.placeholder]});
}
function render(){
document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===state.page));
let h="";
if(state.page==="today")h=home();else if(state.page==="tasks")h=tasksPage();else if(state.page==="calendar")h=calendarPage();else if(state.page==="habits")h=habitsPage();else if(state.page==="goals")h=goalsPage();else if(state.page==="projects")h=projectsPage();else if(state.page==="notes")h=notesPage();else if(state.page==="finances")h=financePage();else if(state.page==="journal")h=journalPage();else if(state.page==="routines")h=routinesPage();else if(state.page==="analytics")h=analyticsPage();else h=settingsPage();
document.getElementById("content").innerHTML=h;
const sl=document.getElementById("settingsLang");if(sl){sl.value=state.lang;sl.onchange=e=>{state.lang=e.target.value;localStorage.setItem("lc-lang",state.lang);locale();render()}}
bind();
translateRendered();
}
function go(p){state.page=p;render();closeMenu();window.scrollTo(0,0)}
function bind(){
document.querySelectorAll("[data-task]").forEach(b=>b.onclick=()=>{b.classList.toggle("done");b.textContent=b.classList.contains("done")?"✓":"";toast(b.classList.contains("done")?"Задача выполнена":"Задача возвращена")});
document.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>action(b.dataset.action));
}
function action(a){
if(a==="go-habits")return go("habits");if(a==="go-goals")return go("goals");if(a==="go-finances")return go("finances");
if(["new-task","new-goal","new-project","new-note","new-habit","new-money","new-journal","new-routine","new-event"].includes(a))return modal(a);
if(a==="theme"){state.dark=!state.dark;localStorage.setItem("lc-dark",state.dark?"1":"0");theme();render();return}
if(a==="export"){let blob=new Blob([JSON.stringify({app:"Life Commander",tasks:data.tasks,goals:data.goals,projects:data.projects},null,2)],{type:"application/json"});let u=URL.createObjectURL(blob),a1=document.createElement("a");a1.href=u;a1.download="life-commander.json";a1.click();URL.revokeObjectURL(u);toast("Файл экспортирован");return}
if(a==="save-journal"){toast("Запись сохранена");return}
if(a==="open-goal"||a==="open-project"||a==="open-note"){modal("details");return}
if(a==="habit-done"){toast("Привычка отмечена");return}
if(a==="import"){toast("Импорт JSON будет доступен после выбора файла");return}
if(a==="reset"){toast("Демо-данные обновлены");return}
toast("Действие выполнено");
}
function modal(type){
let names={"new-task":t("addTask"),"new-goal":t("addGoal"),"new-project":t("addProject"),"new-note":t("addNote"),"new-habit":t("addHabit"),"new-money":"Новая операция","new-journal":"Новая запись","new-routine":"Новая рутина","new-event":"Новое событие",details:"Просмотр"};
document.getElementById("modalBody").innerHTML="<h3>"+(names[type]||t("new"))+"</h3><div class=\"field\"><label>Название</label><input id=\"modalTitle\" placeholder=\"Введите название\"></div><div class=\"field\"><label>Описание</label><textarea placeholder=\"Добавьте детали...\"></textarea></div><div class=\"modal-actions\">"+btn(t("cancel"),"close-modal")+btn(t("save"),"save-modal",true)+"</div>";
document.getElementById("modal").classList.add("show");
translateRendered();
}
function theme(){document.body.style.background=state.dark?"#111827":"var(--bg)";document.body.style.setProperty("--bg",state.dark?"#111827":"#f4f6fa");document.body.style.setProperty("--card",state.dark?"#1a2334":"#fff");document.body.style.setProperty("--ink",state.dark?"#eef2f8":"#182033");document.body.style.setProperty("--line",state.dark?"#2b374c":"#e7ebf3");document.body.style.setProperty("--muted",state.dark?"#9aa6bb":"#748098")}
function locale(){document.getElementById("heroDate").textContent=t("date");document.getElementById("heroTitle").textContent=t("good");document.getElementById("heroSub").textContent=t("sub");document.getElementById("search").placeholder=t("search");document.getElementById("lang").value=state.lang;document.querySelectorAll(".nav button").forEach(b=>b.querySelector("span").textContent=t(b.dataset.page));document.querySelectorAll(".nav-section")[0].textContent=t("plan");document.querySelectorAll(".nav-section")[1].textContent=t("personal")}
function closeMenu(){document.getElementById("side").classList.remove("open");document.getElementById("overlay").classList.remove("show")}
function toast(s){let x=document.getElementById("toast");x.textContent=s;x.classList.add("show");clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.classList.remove("show"),1700)}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>go(b.dataset.page));
document.getElementById("menuBtn").onclick=()=>{document.getElementById("side").classList.add("open");document.getElementById("overlay").classList.add("show")};
document.getElementById("overlay").onclick=closeMenu;
document.getElementById("themeBtn").onclick=()=>action("theme");
document.getElementById("noticeBtn").onclick=()=>toast("Новых уведомлений нет");
document.getElementById("lang").onchange=e=>{state.lang=e.target.value;localStorage.setItem("lc-lang",state.lang);locale();render()};
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")document.getElementById("modal").classList.remove("show")};
document.addEventListener("click",e=>{let b=e.target.closest("[data-action]");if(b&&!b.closest("#content"))action(b.dataset.action)});
theme();locale();render();
</script>
</body>
</html>
