rder-top:1px solid #ffffff13;padding-top:14px;align-items:center;gap:9px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#5b4bf0;font-weight:700}.profile span{font-size:12px}.main{min-width:0}.hero{min-height:205px;padding:14px 24px 24px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(120deg,#1c355e 0%,#426995 42%,#9aa7c8 100%)}.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 72% 22%,#ffe89d 0 12px,#ffdc7b55 13px,transparent 55px),radial-gradient(ellipse at 20% 115%,#102d3c 0 25%,transparent 26%),radial-gradient(ellipse at 52% 120%,#1d3c4c 0 28%,transparent 29%),linear-gradient(155deg,transparent 0 38%,#28485d 39% 44%,transparent 45%),linear-gradient(25deg,transparent 0 52%,#ffffff16 53% 54%,transparent 55%),linear-gradient(160deg,transparent 0 48%,#ffffff10 49% 50%,transparent 51%);opacity:.95}.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:92px;background:linear-gradient(155deg,transparent 0 31%,#203b4a 32% 44%,transparent 45%),linear-gradient(205deg,transparent 0 45%,#152d3b 46% 60%,transparent 61%);opacity:.75}.top,.hero-copy,.quote{position:relative;z-index:2}.top{display:flex;align-items:center;justify-content:flex-end;gap:10px}.search{width:min(370px,46vw);height:40px;border-radius:11px;border:1px solid #ffffff45;background:#ffffffef;color:#20283a;padding:0 15px;outline:none}.tools{display:flex;gap:8px;align-items:center}.tool{height:40px;min-width:40px;border-radius:10px;background:#ffffff18;color:#fff;border:1px solid #ffffff30}.select{height:40px;border-radius:10px;background:#ffffff18;color:#fff;border:1px solid #ffffff35;padding:0 9px}.select option{color:#111;background:#fff}.hero-copy{margin-top:26px}.hero-copy .eyebrow{font-size:12px;color:#e2e7f1}.hero-copy h1{margin:3px 0 2px;font-size:31px;letter-spacing:-.035em}.hero-copy p{margin:0;color:#eef2fa;font-size:13px}.quote{position:absolute;right:24px;bottom:18px;background:#0d1629d9;border:1px solid #ffffff20;border-radius:13px;padding:11px 14px;width:205px;font-size:12px;line-height:1.45}.workspace{padding:0 22px 35px;margin-top:-11px;position:relative;z-index:3}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.stat{padding:14px 15px;display:flex;gap:11px;align-items:center}.stat-icon{width:39px;height:39px;border-radius:11px;display:grid;place-items:center;font-size:18px;background:#f0efff;color:var(--violet)}.stat:nth-child(1) .stat-icon{background:#e8fbf4;color:#19ae7d}.stat:nth-child(2) .stat-icon{background:#eef1ff;color:#5e5bf4}.stat:nth-child(3) .stat-icon{background:#fff0f5;color:#e64d88}.stat:nth-child(4) .stat-icon{background:#f0edff;color:#6b4ff4}.stat small{display:block;color:var(--muted);font-size:10px}.stat strong{font-size:18px;display:block;margin:2px 0}.progress{height:5px;background:#edf0f6;border-radius:8px;overflow:hidden;width:106px}.progress span{display:block;height:100%;background:var(--violet);border-radius:8px}.layout{display:grid;grid-template-columns:minmax(0,1.28fr) minmax(0,1.28fr) minmax(250px,.72fr);grid-template-rows:auto auto;gap:14px;margin-top:14px}.layout>.panel:nth-child(1),.layout>.panel:nth-child(2){grid-row:1 / span 2}.layout>.panel:nth-child(1){grid-column:1}.layout>.panel:nth-child(2){grid-column:2}.layout>.calendar-card{grid-column:3;grid-row:1}.layout>.side-panel{grid-column:3;grid-row:2}.panel{padding:15px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}.head h2{font-size:15px;margin:0;letter-spacing:-.01em}.add{width:30px;height:30px;border-radius:9px;background:#eeeaff;color:#554bf1;font-size:18px;font-weight:700}.tasks{display:grid;gap:1px}.task{display:grid;grid-template-columns:22px 1fr auto;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid #eef1f5}.task:last-child{border-bottom:0}.check{width:20px;height:20px;border:1.5px solid #b9c2d3;border-radius:6px}.check.done{background:#27bf92;border-color:#27bf92;color:#fff;display:grid;place-items:center;font-size:12px}.task b{font-size:12px;font-weight:650}.task small{display:block;color:var(--muted);margin-top:2px;font-size:10px}.badge{font-size:9px;padding:4px 6px;border-radius:6px;background:#edf4ff;color:#3778d8}.timeline{display:grid;gap:5px}.event{display:grid;grid-template-columns:43px 1fr;gap:8px;align-items:start}.event time{font-size:10px;color:#67738a;padding-top:10px}.event-box{border-left:3px solid var(--blue);padding:8px 10px;background:#f3f8ff;border-radius:0 9px 9px 0}.event-box b{font-size:11px}.event-box small{display:block;color:var(--muted);margin-top:2px;font-size:9px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:10px;text-align:center}.calendar-card{min-height:220px}.side-panel{min-height:260px}.calendar span{padding:5px 0;color:#7e889d}.calendar b{padding:5px 0;border-radius:7px;font-weight:600}.calendar .today{background:var(--violet);color:#fff}.calendar .dot{position:relative}.calendar .dot:after{content:"";position:absolute;width:4px;height:4px;background:#31bd8e;border-radius:50%;bottom:0;left:calc(50% - 2px)}.habit-list{display:grid;gap:8px}.habit{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center}.habit-icon{font-size:17px}.habit b{font-size:11px}.dots{display:flex;gap:3px}.dots i{width:7px;height:7px;border-radius:50%;background:#dfe3eb}.dots i.on{background:#40bf9b}.lower{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:14px}.list{display:grid;gap:9px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.row b{font-size:11px}.row small{color:var(--muted);font-size:9px}.bar{height:6px;background:#edf0f5;border-radius:10px;margin-top:5px;overflow:hidden}.bar span{height:100%;display:block;border-radius:10px;background:var(--violet)}.green .bar span{background:var(--green)}.orange .bar span{background:var(--orange)}.finance-number{font-size:22px;font-weight:800;margin:4px 0}.finance-row{margin-top:8px}.trend{font-size:9px;font-weight:700}.trend.up{color:#21ad7c}.trend.red{color:#ef537d}.chart{height:28px;display:flex;gap:3px;align-items:end;justify-content:flex-end}.chart i{width:6px;border-radius:3px 3px 0 0;background:#54d2ad}.chart.blue i{background:#5e8ff0}.chart.pink i{background:#f17ba4}.mood{display:grid;gap:10px}.metric{display:grid;grid-template-columns:58px 1fr 26px;gap:7px;align-items:center;font-size:10px}.metric .bar{margin:0}.note{background:#f8f9fc;border:1px solid #e5e8ef;border-radius:10px;padding:10px;color:#8b94a7;font-size:10px;min-height:52px}.review{margin-top:9px}.foot-note{margin-top:13px;text-align:center;color:#9099aa;font-size:9px}.toast{position:fixed;right:20px;bottom:20px;background:#151c2f;color:#fff;padding:11px 14px;border-radius:11px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none;z-index:50}.toast.show{opacity:1;transform:none}
@media(max-width:1180px){
  .app{grid-template-columns:240px 1fr}
  .side{padding:18px 13px}
  .workspace{padding-left:16px;padding-right:16px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .layout{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .layout>.panel:nth-child(1),.layout>.panel:nth-child(2),.layout>.calendar-card,.layout>.side-panel{grid-column:auto;grid-row:auto}
  .calendar-card{min-height:unset}
  .lower{grid-template-columns:1fr 1fr}
}
@media(max-width:900px){
  body{overflow-x:hidden}
  .app{display:block}
  .side{
    position:fixed;z-index:60;left:0;top:0;bottom:0;width:270px;height:100vh;
    transform:translateX(-102%);transition:transform .24s ease;
    box-shadow:18px 0 40px rgba(7,13,30,.28);overflow-y:auto
  }
  body.menu-open .side{transform:translateX(0)}
  .brand div:not(.logo),.nav span,.nav-section,.side-foot{display:block}
  .brand{justify-content:flex-start;padding-bottom:22px}
  .nav button{justify-content:flex-start;padding:0 13px}
  .side-foot{position:relative;left:auto;right:auto;bottom:auto;margin-top:18px}
  .profile{display:none}
  .menu-toggle{display:grid!important}
  .menu-overlay{display:block}
  body.menu-open .menu-overlay{opacity:1;pointer-events:auto}
  .hero{min-height:230px}
  .quote{display:none}
  .lower{grid-template-columns:1fr 1fr}
}
@media(max-width:680px){
  .hero{padding:12px 14px 30px;min-height:220px}
  .top{justify-content:flex-start;gap:7px}
  .search{width:min(100%,calc(100vw - 120px));height:38px}
  .tools{gap:5px}
  .tools .tool{min-width:36px;height:38px}
  .select{height:38px}
  .hero-copy{margin-top:34px}
  .hero-copy h1{font-size:25px}
  .workspace{padding:0 12px 25px;margin-top:-10px}
  .stats{grid-template-columns:1fr 1fr}
  .layout,.lower{grid-template-columns:1fr}
  .layout .side-panel{grid-column:auto}
  .panel{padding:14px}
  .calendar-card{order:-1}
}
@media(max-width:430px){
  .stats{grid-template-columns:1fr}
  .search{width:calc(100vw - 120px)}
  .tools .tool{display:none}
  .hero-copy h1{font-size:23px}
  .stat strong{font-size:16px}
}
</style>

<body>
<div class="app">
<aside class="side">
  <div class="brand"><div class="logo">♛</div><div><b>Life Commander</b><small data-i18n="tagline"></small></div></div>
  <div class="nav">
    <div class="nav-section" data-i18n="plan"></div>
    <button class="active"><i>⌂</i><span data-i18n="today"></span></button>
    <button><i>☑</i><span data-i18n="tasks"></span></button>
    <button><i>▦</i><span data-i18n="calendar"></span></button>
    <button><i>◉</i><span data-i18n="habits"></span></button>
    <button><i>◎</i><span data-i18n="goals"></span></button>
    <button><i>▣</i><span data-i18n="projects"></span></button>
    <div class="nav-section" data-i18n="personal"></div>
    <button><i>▤</i><span data-i18n="notes"></span></button>
    <button><i>€</i><span data-i18n="finances"></span></button>
    <button><i>◌</i><span data-i18n="journal"></span></button>
    <button><i>↻</i><span data-i18n="routines"></span></button>
    <button><i>◒</i><span data-i18n="analytics"></span></button>
    <button><i>⚙</i><span data-i18n="settings"></span></button>
  </div>
  <div class="side-foot"><div class="ring"><span>68%</span></div><b data-i18n="excellentDay"></b><small data-i18n="dayProgress"></small></div>
</aside>
<div class="menu-overlay" data-action="close-menu"></div>
<main class="main">
<section class="hero">
  <div class="top">
    <input class="search" data-i18n-placeholder="search" data-i18n-aria="searchAria">
    <div class="tools"><button class="tool menu-toggle" data-action="menu" aria-label="Open menu" style="display:none">☰</button><button class="tool" data-action="theme" data-i18n-aria="themeAria">☼</button><button class="tool" data-action="notice" data-i18n-aria="notificationsAria">♧</button><select id="lang" class="select" data-i18n-aria="languageAria"><option value="en">EN</option><option value="ru">RU</option><option value="es">ES</option><option value="de">DE</option><option value="fr">FR</option></select></div>
  </div>
  <div class="hero-copy"><div class="eyebrow" data-i18n="date"></div><h1 data-i18n="greeting"></h1><p data-i18n="quote"></p></div>
  <div class="quote">“ <b data-i18n="focusTitle"></b><br><span data-i18n="focusText"></span></div>
</section>
<section class="workspace">
  <div class="stats">
    <div class="card stat"><div class="stat-icon">✓</div><div><small data-i18n="tasksToday"></small><strong>5 / 8</strong><div class="progress"><span style="width:62%"></span></div></div></div>
    <div class="card stat"><div class="stat-icon">▦</div><div><small data-i18n="planned"></small><strong>3 <small style="display:inline" data-i18n="meetings"></small></strong></div></div>
    <div class="card stat"><div class="stat-icon">◎</div><div><small data-i18n="activeGoals"></small><strong>4 / 7</strong><div class="progress"><span style="width:57%"></span></div></div></div>
    <div class="card stat"><div class="stat-icon">▣</div><div><small data-i18n="activeProjects"></small><strong>3 / 6</strong><div class="progress"><span style="width:50%"></span></div></div></div>
  </div>
  <div class="layout">
    <article class="card panel"><div class="head"><h2>⭐ <span data-i18n="topTasks"></span></h2><button class="add">+</button></div><div class="tasks">
      <div class="task"><div class="check done">✓</div><div><b data-i18n="task1"></b><small data-i18n="work"></small></div><span class="badge">10:00</span></div>
      <div class="task"><div class="check"></div><div><b data-i18n="task2"></b><small data-i18n="health"></small></div><span class="badge">18:30</span></div>
      <div class="task"><div class="check"></div><div><b data-i18n="task3"></b><small data-i18n="personalLabel"></small></div><span class="badge">12:00</span></div>
      <div class="task"><div class="check"></div><div><b data-i18n="task4"></b><small data-i18n="learning"></small></div><span class="badge">14:00</span></div>
      <div class="task"><div class="check"></div><div><b data-i18n="task5"></b><small data-i18n="work"></small></div><span class="badge">16:00</span></div>
    </div></article>
    <article class="card panel"><div class="head"><h2>▣ <span data-i18n="schedule"></span></h2><button class="add">+</button></div><div class="timeline">
      <div class="event"><time>08:00</time><div class="event-box" style="border-color:#35c59a"><b data-i18n="event1"></b><small data-i18n="event1sub"></small></div></div>
      <div class="event"><time>09:00</time><div class="event-box"><b data-i18n="event2"></b><small data-i18n="event2sub"></small></div></div>
      <div class="event"><time>11:30</time><div class="event-box" style="border-color:#7a61e9"><b data-i18n="event3"></b><small data-i18n="event3sub"></small></div></div>
      <div class="event"><time>14:00</time><div class="event-box" style="border-color:#f2a12b"><b data-i18n="event4"></b><small data-i18n="event4sub"></small></div></div>
      <div class="event"><time>18:30</time><div class="event-box" style="border-color:#e85d94"><b data-i18n="event5"></b><small data-i18n="event5sub"></small></div></div>
    </div></article>
    <article class="card panel calendar-card"><div class="head"><h2 data-i18n="month"></h2><span class="muted">‹ &nbsp; ›</span></div><div class="calendar"><span data-i18n="mon"></span><span data-i18n="tue"></span><span data-i18n="wed"></span><span data-i18n="thu"></span><span data-i18n="fri"></span><span data-i18n="sat"></span><span data-i18n="sun"></span><b>1</b><b>2</b><b>3</b><b>4</b><b>5</b><b>6</b><b>7</b><b>8</b><b>9</b><b class="dot">10</b><b>11</b><b>12</b><b>13</b><b>14</b><b>15</b><b>16</b><b>17</b><b class="dot">18</b><b>19</b><b>20</b><b>21</b><b>22</b><b>23</b><b>24</b><b>25</b><b class="today">26</b><b>27</b><b>28</b><b>29</b><b>30</b></div></article>
    <article class="card panel side-panel"><div class="head"><h2>◉ <span data-i18n="habitsTitle"></span></h2><span class="muted">4 / 6</span><button class="add">+</button></div><div class="habit-list">
      <div class="habit"><span class="habit-icon">💧</span><div><b data-i18n="water"></b></div><div class="dots"><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div></div>
      <div class="habit"><span class="habit-icon">🚶</span><div><b data-i18n="walk"></b></div><div class="dots"><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div></div>
      <div class="habit"><span class="habit-icon">📖</span><div><b data-i18n="reading"></b></div><div class="dots"><i></i><i class="on"></i><i class="on"></i><i></i></div></div>
      <div class="habit"><span class="habit-icon">🏋️</span><div><b data-i18n="workout"></b></div><div class="dots"><i></i><i></i><i></i><i></i></div></div>
      <div class="habit"><span class="habit-icon">🪷</span><div><b data-i18n="meditation"></b></div><div class="dots"><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div></div>
      <div class="habit"><span class="habit-icon">🌙</span><div><b data-i18n="sleep"></b></div><div class="dots"><i></i><i></i><i></i><i></i></div></div>
    </div></article>
  </div>
  <div class="lower">
    <article class="card panel"><div class="head"><h2>🎯 <span data-i18n="goals"></span></h2><button class="add">+</button></div><div class="list">
      <div><div class="row"><b data-i18n="goal1"></b><small>82%</small></div><small data-i18n="goal1sub"></small><div class="bar green"><span style="width:82%"></span></div></div>
      <div><div class="row"><b data-i18n="goal2"></b><small>80%</small></div><small data-i18n="goal2sub"></small><div class="bar"><span style="width:80%"></span></div></div>
      <div><div class="row"><b data-i18n="goal3"></b><small>60%</small></div><small data-i18n="goal3sub"></small><div class="bar orange"><span style="width:60%"></span></div></div>
    </div></article>
    <article class="card panel"><div class="head"><h2>📁 <span data-i18n="projects"></span></h2><button class="add">+</button></div><div class="list">
      <div><div class="row"><b data-i18n="project1"></b><small>75%</small></div><small data-i18n="design"></small><div class="bar"><span style="width:75%"></span></div></div>
      <div><div class="row"><b data-i18n="project2"></b><small>45%</small></div><small data-i18n="home"></small><div class="bar"><span style="width:45%"></span></div></div>
      <div><div class="row"><b data-i18n="project3"></b><small>60%</small></div><small data-i18n="learning"></small><div class="bar orange"><span style="width:60%"></span></div></div>
