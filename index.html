<body>
<div class="app">
<aside class="side">
  <div class="brand"><div class="logo">♛</div><div><b>Life Commander</b><small data-i18n="tagline"></small></div></div>
  <div class="nav">
    <div class="nav-section" data-i18n="plan"></div>
    <button class="active" data-screen="today"><i>⌂</i><span data-i18n="today"></span></button>
    <button data-screen="tasks"><i>☑</i><span data-i18n="tasks"></span></button>
    <button data-screen="calendar"><i>▦</i><span data-i18n="calendar"></span></button>
    <button data-screen="habits"><i>◉</i><span data-i18n="habits"></span></button>
    <button data-screen="goals"><i>◎</i><span data-i18n="goals"></span></button>
    <button data-screen="projects"><i>▣</i><span data-i18n="projects"></span></button>
    <div class="nav-section" data-i18n="personal"></div>
    <button data-screen="notes"><i>▤</i><span data-i18n="notes"></span></button>
    <button data-screen="finances"><i>€</i><span data-i18n="finances"></span></button>
    <button data-screen="journal"><i>◌</i><span data-i18n="journal"></span></button>
    <button data-screen="routines"><i>↻</i><span data-i18n="routines"></span></button>
    <button data-screen="analytics"><i>◒</i><span data-i18n="analytics"></span></button>
    <button data-screen="settings"><i>⚙</i><span data-i18n="settings"></span></button>
  </div>
  <div class="side-foot"><div class="ring"><span>68%</span></div><small data-i18n="dayProgress"></small></div>
</aside>
<main class="main">
<section class="hero">
  <div class="top">
    <input class="search" data-i18n-placeholder="search" data-i18n-aria="searchAria">

  </div>
  <div class="hero-copy"><div class="eyebrow" data-i18n="date"></div><h1 data-i18n="greeting"></h1><p data-i18n="quote"></p></div>
  <div class="quote"><b data-i18n="focusTitle"></b><br><span data-i18n="focusText"></span></div>
</section>
<section class="workspace">
  <div class="stats">
    <div class="card stat"><div class="stat-icon">✓</div><div><small data-i18n="tasksToday"></small><strong>5 / 8</strong><div class="progress"><span style="width:62%"></span></div></div></div>
    <div class="card stat"><div class="stat-icon">▦</div><div><small data-i18n="planned"></small><strong>3</strong><small data-i18n="meetings"></small></div></div>

    <div class="card stat"><div class="stat-icon">▣</div><div><small data-i18n="activeProjects"></small><strong>3 / 6</strong><div class="progress"><span style="width:50%"></span></div></div></div>
  </div>
  <div class="grid">
    <article class="card panel"><div class="head"><h2 data-i18n="topTasks"></h2><button class="add" data-action="add">+</button></div><div class="tasks">
      <div class="task"><div class="check done">✓</div><div><b data-i18n="task1"></b><small data-i18n="work"></small></div><span class="badge">10:00</span></div>

    </div></article>
    <article class="card panel"><div class="head"><h2 data-i18n="schedule"></h2><button class="add" data-action="add">+</button></div><div class="timeline">

    </div></article>
    <article class="card panel"><div class="head"><h2 data-i18n="month"></h2><span class="muted">‹ &nbsp; ›</span></div><div class="mini-cal"><span data-i18n="mon"></span><span data-i18n="tue"></span><span data-i18n="wed"></span><span data-i18n="thu"></span><span data-i18n="fri"></span><span data-i18n="sat"></span><span data-i18n="sun"></span><b>1</b><b>2</b><b>3</b><b>4</b><b>5</b><b>6</b><b>7</b><b>8</b><b>9</b><b class="dot">10</b><b>11</b><b>12</b><b>13</b><b>14</b><b>15</b><b>16</b><b>17</b><b class="dot">18</b><b>19</b><b>20</b><b>21</b><b>22</b><b>23</b><b>24</b><b>25</b><b class="today">26</b><b>27</b><b>28</b><b>29</b><b>30</b></div></article>
  </div>
  <div class="lower">
    <article class="card panel"><div class="head"><h2 data-i18n="goals"></h2><button class="add">+</button></div><div class="list">
      <div><div class="row"><b data-i18n="goal1"></b><small>82%</small></div><small data-i18n="goal1sub"></small><div class="bar green"><span style="width:82%"></span></div></div>
      <div><div class="row"><b data-i18n="goal2"></b><small>80%</small></div><small data-i18n="goal2sub"></small><div class="bar"><span style="width:80%"></span></div></div>
      <div><div class="row"><b data-i18n="goal3"></b><small>60%</small></div><small data-i18n="goal3sub"></small><div class="bar orange"><span style="width:60%"></span></div></div>
    </div></article>
    <article class="card panel"><div class="head"><h2 data-i18n="projects"></h2><button class="add">+</button></div><div class="list">
      <div><div class="row"><b data-i18n="project1"></b><small>75%</small></div><small data-i18n="design"></small><div class="bar"><span style="width:75%"></span></div></div>
      <div><div class="row"><b data-i18n="project2"></b><small>45%</small></div><small data-i18n="home"></small><div class="bar"><span style="width:45%"></span></div></div>
      <div><div class="row"><b data-i18n="project3"></b><small>60%</small></div><small data-i18n="learning"></small><div class="bar orange"><span style="width:60%"></span></div></div>
    </div></article>
    <article class="card panel"><div class="head"><h2 data-i18n="finances"></h2><button class="add">+</button></div><div class="finance-number">€2,400</div><div class="muted" data-i18n="income"></div><div class="row" style="margin-top:12px"><span class="muted" data-i18n="expenses"></span><b>€1,850</b></div><div class="row" style="margin-top:7px"><span class="muted" data-i18n="savings"></span><b>€5,320</b></div></article>
    <article class="card panel"><div class="head"><h2 data-i18n="moodEnergy"></h2></div><div class="mood"><div class="metric"><span data-i18n="mood"></span><div class="bar orange"><span style="width:70%"></span></div><b>7</b></div><div class="metric"><span data-i18n="energy"></span><div class="bar"><span style="width:60%"></span></div><b>6</b></div><div class="note" data-i18n="moodQuote"></div></div></article>
  </div>
  <div class="grid" style="grid-template-columns:1fr 1fr;margin-top:16px">
    <article class="card panel"><div class="head"><h2 data-i18n="quickNote"></h2><button class="add">+</button></div><div class="note" data-i18n="notePlaceholder"></div></article>
    <article class="card panel"><div class="head"><h2 data-i18n="weeklyReview"></h2><span class="muted">68%</span></div><div class="row"><span class="muted" data-i18n="weekTasks"></span><b>42</b></div><div class="bar green"><span style="width:81%"></span></div><div class="row" style="margin-top:10px"><span class="muted" data-i18n="weekHabits"></span><b>81%</b></div></article>
  </div>
  <div class="foot-note" data-i18n="previewNote"></div>
</section>
</main>
</div>

let lang=localStorage.getItem("lc-lang")||"en";
function t(k){return (L[lang]&&L[lang][k])||L.en[k]||k}
function apply(){
 document.documentElement.lang=lang;document.title="Life Commander";
 document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=t(e.dataset.i18n));
 document.querySelectorAll("[data-i18n-placeholder]").forEach(e=>e.placeholder=t(e.dataset.i18nPlaceholder));document.querySelectorAll("[data-i18n-aria]").forEach(e=>e.setAttribute("aria-label",t(e.dataset.i18nAria)));
 document.querySelectorAll("[data-i18n]").forEach(e=>{if(e.title)e.title=t(e.dataset.i18n)});
 document.getElementById("lang").value=lang;
}
document.getElementById("lang").addEventListener("change",e=>{lang=e.target.value;localStorage.setItem("lc-lang",lang);apply();toast(t("settings"))});
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");toast(t(b.querySelector("[data-i18n]").dataset.i18n))}));
document.querySelectorAll("[data-action]").forEach(b=>b.addEventListener("click",()=>toast(t("previewNote"))));

apply();
</script>
