function saveModal(){const modalEl=document.getElementById("modal"),type=modalEl.dataset.type;if(type==="task-details"){const x=db.tasks.find(v=>v.id===modalEl.dataset.id);if(x){x.title=document.getElementById("mTitle").value.trim();x.description=document.getElementById("mDesc").value.trim();x.time=document.getElementById("mTime").value;x.category=document.getElementById("mCategory").value.trim();x.due=document.getElementById("mDue").value;x.reminder=document.getElementById("mReminder").value;x.repeat=document.getElementById("mRepeat").value;x.priority=Number(document.getElementById("mPriority").value||4);persist();closeModal();toast(t("saved"));render()}return}const id=uid(),title=document.getElementById("mTitle")?.value.trim()||"",desc=document.getElementById("mDesc")?.value.trim()||"";if(type==="new-money"){const amount=Number(document.getElementById("mAmount").value);if(!amount)return toast(t("amount"));db.transactions.unshift({id,date:new Date().toISOString().slice(0,10),type:document.getElementById("mType").value,amount,category:document.getElementById("mCategory").value.trim()});}else if(type==="new-event"){if(!title)return toast(t("title"));db.events.unshift({id,date:document.getElementById("mDate").value,time:document.getElementById("mTime").value,title,description:desc});}else if(!title){return toast(t("title"))}else if(type==="new-task")db.tasks.unshift({id,title,description:desc,time:document.getElementById("mTime")?.value||"",category:document.getElementById("mCategory")?.value||"",due:"",reminder:"",repeat:"none",priority:4,done:false});else if(type==="new-goal")db.goals.unshift({id,title,description:desc,progress:Number(document.getElementById("mProgress")?.value||0)});else if(type==="new-project")db.projects.unshift({id,title,description:desc,status:"planned",progress:0});else if(type==="new-note")db.notes.unshift({id,title,description:desc});else if(type==="new-habit")db.habits.unshift({id,title,description:desc,streak:0});else if(type==="new-journal")db.journal.unshift({id,date:new Date().toLocaleDateString(),description:desc||title});else if(type==="new-routine")db.routines.unshift({id,title,description:desc,time:document.getElementById("mTime")?.value||""});persist();closeModal();toast(t("saved"));render()}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function translateModal(){document.querySelectorAll("#modal [placeholder]").forEach(()=>{})}
function theme(){document.body.style.background=state.dark?"#111827":"var(--bg)";document.body.style.setProperty("--bg",state.dark?"#111827":"#f4f6fa");document.body.style.setProperty("--card",state.dark?"#1a2334":"#fff");document.body.style.setProperty("--ink",state.dark?"#eef2f8":"#182033");document.body.style.setProperty("--line",state.dark?"#2b374c":"#e7ebf3");document.body.style.setProperty("--muted",state.dark?"#9aa6bb":"#748098")}
function locale(){document.getElementById("search").placeholder=t("search");document.getElementById("lang").value=state.lang;const ns=document.querySelectorAll(".nav-section");if(ns[0])ns[0].textContent=t("plan");if(ns[1])ns[1].textContent=t("personal");document.querySelectorAll(".nav button").forEach(b=>b.querySelector("span").textContent=t(b.dataset.page));document.getElementById("heroTitle").textContent=t("good");document.getElementById("heroSub").textContent=t("sub");document.getElementById("heroDate").textContent=new Date().toLocaleDateString(state.lang,{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
function closeMenu(){document.getElementById("side").classList.remove("open");document.getElementById("overlay").classList.remove("show")}
function toast(s){const x=document.getElementById("toast");x.textContent=s;x.classList.add("show");clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.classList.remove("show"),1700)}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>go(b.dataset.page));
document.getElementById("menuBtn").onclick=()=>{document.getElementById("side").classList.add("open");document.getElementById("overlay").classList.add("show")};
document.getElementById("overlay").onclick=closeMenu;
document.getElementById("themeBtn").onclick=()=>action("theme");
document.getElementById("noticeBtn").onclick=()=>toast(t("noNotifications"));
document.getElementById("lang").onchange=e=>{state.lang=e.target.value;localStorage.setItem("lc-lang",state.lang);render()};
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")closeModal()};
theme();render();




</script>
