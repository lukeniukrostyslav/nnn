:16px}.modal-backdrop.show{display:flex}.modal{width:min(520px,100%);background:#fff;border-radius:18px;padding:18px;box-shadow:0 25px 70px #0005}.modal h3{margin:0 0 14px}.field{display:grid;gap:6px;margin:10px 0}.field label{font-size:10px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;outline:none;background:#fff}.field textarea{min-height:90px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.toast{position:fixed;right:20px;bottom:20px;background:#151c2f;color:#fff;padding:11px 14px;border-radius:11px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none;z-index:120;font-size:12px}.toast.show{opacity:1;transform:none}.menu-overlay{display:none}.menu-toggle{display:none!important}

<script>
const state={page:'today',lang:localStorage.getItem('lc-lang')||'ru',dark:localStorage.getItem('lc-dark')==='1',month:8};
const T={
ru:{today:'Сегодня',tasks:'Задачи',calendar:'Календарь',habits:'Привычки',goals:'Цели',projects:'Проекты',notes:'Заметки',finances:'Финансы',journal:'Дневник',routines:'Рутины',analytics:'Аналитика',settings:'Настройки',newTask:'Новая задача',newGoal:'Новая цель',newProject:'Новый проект',newNote:'Новая заметка',newHabit:'Новая привычка',add:'Добавить',save:'Сохранить',cancel:'Отмена',search:'Поиск задач, заметок, проектов...',good:'Доброе утро, Ростислав',sub:'Маленькие шаги каждый день приводят к большим результатам.',date:'Понедельник, 29 сентября 2025'},

}

function routinesPage(){return '<div class="page">'+head(tr('routines'),'Автоматизируй повторяющиеся сценарии дня',button('+ Новая рутина','new-routine','btn primary'))+'<div class="grid g3">'+[['🌅','Утро','08:00','Завтрак → план → вода'],['💼','Рабочий старт','09:00','Почта → приоритеты → deep work'],['🌙','Вечер','21:30','Дневник → план завтра → сон']].map(x=>'<article class="card panel"><div class="row"><div class="goal-icon">'+x[0]+'</div><span class="tag">'+x[2]+'</span></div><h3>'+x[1]+'</h3><p class="muted">'+x[3]+'</p>'+button('Настроить','edit-routine','btn soft')+'</article>').join('')+'</div></div>'}
function analyticsPage(){return '<div class="page">'+head(tr('analytics'),'Понимай, куда уходит время и энергия')+'<div class="grid g4"><div class="card panel"><div class="item-sub">Выполнение задач</div><div class="money">78%</div></div><div class="card panel"><div class="item-sub">Привычки</div><div class="money">71%</div></div><div class="card panel"><div class="item-sub">Цели</div><div class="money">62%</div></div><div class="card panel"><div class="item-sub">Фокус</div><div class="money">6.4 ч</div></div></div><div class="grid g2" style="margin-top:14px"><article class="card panel"><div class="panel-head"><h3>Продуктивность по дням</h3></div><div class="chart">'+[50,68,72,45,80,91,76].map(h=>'<i style="height:'+h+'%"></i>').join('')+'</div></article><article class="card panel"><div class="panel-head"><h3>Распределение времени</h3></div><div class="metric"><span>Работа</span><div class="bar"><span style="width:68%"></span></div><b>34%</b></div><div class="metric"><span>Здоровье</span><div class="bar"><span style="width:42%"></span></div><b>21%</b></div><div class="metric"><span>Обучение</span><div class="bar"><span style="width:30%"></span></div><b>15%</b></div><div class="metric"><span>Личное</span><div class="bar"><span style="width:60%"></span></div><b>30%</b></div></article></div></div>'}
function settingsPage(){return '<div class="page">'+head(tr('settings'),'Персонализация Life Commander')+'<div class="grid g2"><article class="card panel"><div class="panel-head"><h3>Внешний вид</h3></div><div class="list"><div class="item row"><span>Тёмная тема</span>'+button(state.dark?'Включена':'Выключена','theme','btn soft')+'</div><div class="item row"><span>Язык интерфейса</span><select id="settingsLang" class="btn"><option value="ru">Русский</option><option value="en">English</option><option value="es">Español</option><option value="de">Deutsch</option><option value="fr">Français</option></select></div></div></article><article class="card panel"><div class="panel-head"><h3>Данные</h3></div><div class="list"><button class="item row" data-action="export"><b>Экспорт данных</b><span>JSON →</span></button><button class="item row" data-action="import"><b>Импорт данных</b><span>JSON →</span></button><button class="item row" data-action="reset"><b>Сбросить демо-данные</b><span>↻</span></button></div></article></div></div>'}
function openModal(type){let title=tr(type==='new-task'?'newTask':type==='new-goal'?'newGoal':type==='new-project'?'newProject':type==='new-note'?'newNote':type==='new-habit'?'newHabit':'add');document.getElementById('modalBody').innerHTML='<h3>'+title+'</h3><div class="field"><label>Название</label><input id="modalTitle" placeholder="Введите название"></div><div class="field"><label>Описание</label><textarea placeholder="Короткое описание..."></textarea></div><div class="modal-actions">'+button(tr('cancel'),'close-modal','btn')+button(tr('save'),'save-modal','btn primary')+'</div>';document.getElementById('modal').classList.add('show')}
function bindPage(){
 document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{b.classList.toggle('done');b.textContent=b.classList.contains('done')?'✓':'';toast(b.classList.contains('done')?'Задача выполнена':'Задача возвращена')});
 document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));
 const sl=document.getElementById('settingsLang');if(sl){sl.value=state.lang;sl.onchange=e=>{state.lang=e.target.value;localStorage.setItem('lc-lang',state.lang);updateLocale();render()}}
}
function action(a){
 if(['new-task','new-goal','new-project','new-note','new-habit','new-money','new-journal','new-routine','new-event'].includes(a))return openModal(a);
 if(a==='close-modal'){document.getElementById('modal').classList.remove('show');return}
 if(a==='save-modal'){document.getElementById('modal').classList.remove('show');toast('Сохранено');return}
 if(a==='theme'){state.dark=!state.dark;localStorage.setItem('lc-dark',state.dark?'1':'0');applyTheme();render();return}
 if(a==='habits'||a==='goals'||a==='finances'){go(a);return}
 if(a==='next-month'||a==='prev-month'){toast(a==='next-month'?'Следующий месяц':'Предыдущий месяц');return}
 if(a==='today'){go('today');return}
 if(a==='export'){const blob=new Blob([JSON.stringify({app:'Life Commander',version:1,exported:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const x=document.createElement('a');x.href=url;x.download='life-commander-export.json';x.click();URL.revokeObjectURL(url);toast('Экспорт создан');return}
 if(a==='import'){toast('Выбери JSON-файл для импорта в следующей версии');return}
 if(a==='reset'){toast('Демо-данные обновлены');return}
 toast('Раздел готов к работе');
}
function go(p){state.page=p;render();window.scrollTo({top:0,behavior:'smooth'});closeMenu()}
function updateLocale(){document.getElementById('heroDate').textContent=tr('date');document.getElementById('heroTitle').textContent=tr('good');document.getElementById('heroSub').textContent=tr('sub');document.getElementById('search').placeholder=tr('search');document.querySelectorAll('.nav button').forEach(b=>{const key=b.dataset.page;if(b.querySelector('span'))b.querySelector('span').textContent=tr(key)});document.querySelector('.nav-section').textContent=state.lang==='ru'?'ПЛАН':'PLAN'}
function applyTheme(){document.body.style.background=state.dark?'#111827':'var(--bg)';document.body.style.setProperty('--bg',state.dark?'#111827':'#f4f6fa');document.body.style.setProperty('--card',state.dark?'#1a2334':'#fff');document.body.style.setProperty('--ink',state.dark?'#eef2f8':'#182033');document.body.style.setProperty('--line',state.dark?'#2b374c':'#e7ebf3');document.body.style.setProperty('--muted',state.dark?'#9aa6bb':'#748098')}
function closeMenu(){document.getElementById('side').classList.remove('open');document.getElementById('overlay').classList.remove('show')}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));
document.getElementById('menuBtn').onclick=()=>{document.getElementById('side').classList.add('open');document.getElementById('overlay').classList.add('show')};
document.getElementById('overlay').onclick=closeMenu;
document.getElementById('themeBtn').onclick=()=>action('theme');
document.getElementById('noticeBtn').onclick=()=>toast('Новых уведомлений нет');
document.getElementById('lang').onchange=e=>{state.lang=e.target.value;localStorage.setItem('lc-lang',state.lang);updateLocale();render()};
document.getElementById('search').oninput=e=>{if(e.target.value.trim())toast('Поиск: '+e.target.value.trim())};
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')action('close-modal')};
function toast(s){const x=document.getElementById('toast');x.textContent=s;x.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.classList.remove('show'),1700)}
applyTheme();updateLocale();render();
</script>
