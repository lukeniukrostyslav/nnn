function detail(a){const [type,id]=a.split(":");const x=db[type==="goal"?"goals":type==="project"?"projects":"routines"].find(v=>v.id===id);if(!x)return;modal("details",x)}
function modal(type,x){
const names={"task-details":t("details"),"new-task":t("addTask"),"new-goal":t("addGoal"),"new-project":t("addProject"),"new-note":t("addNote"),"new-habit":t("addHabit"),"new-money":t("addMoney"),"new-journal":t("addJournal"),"new-routine":t("addRoutine"),"new-event":t("addEvent")};

function saveModal(){const modalEl=document.getElementById("modal"),type=modalEl.dataset.type;if(type==="task-details"){const x=db.tasks.find(v=>v.id===modalEl.dataset.id);if(x){x.title=document.getElementById("mTitle").value.trim();if(!x.title)return toast(t("requiredTitle"));x.description=document.getElementById("mDesc").value.trim();x.time=document.getElementById("mTime").value;x.category=document.getElementById("mCategory").value.trim();x.due=document.getElementById("mDue").value;x.reminder=document.getElementById("mReminder").value;x.repeat=document.getElementById("mRepeat").value;x.priority=Number(document.getElementById("mPriority").value||4);persist();closeModal();toast(t("saved"));render()}return}const id=uid(),title=document.getElementById("mTitle")?.value.trim()||"",desc=document.getElementById("mDesc")?.value.trim()||"";if(type==="edit-journal"||type==="new-journal"){if(!title)return toast(t("requiredTitle"));const x=type==="edit-journal"?db.journal.find(v=>v.id===modalEl.dataset.id):{id};x.title=title;x.date=document.getElementById("mJournalDate").value;x.mood=document.getElementById("mMood").value.trim();x.tags=document.getElementById("mTags").value.split(",").map(v=>v.trim()).filter(Boolean);x.description=desc;if(type==="new-journal")db.journal.unshift(x);persist();closeModal();toast(t("saved"));render();return}if(type==="edit-routine"||type==="new-routine"){if(!title)return toast(t("requiredTitle"));const rows=[...document.querySelectorAll(".r-step")];const steps=rows.map((el,i)=>({id:String(i+1),title:el.value.trim(),done:false})).filter(x=>x.title);const r=type==="edit-routine"?db.routines.find(v=>v.id===modalEl.dataset.id):{id,type:"routine",runs:[]};r.title=title;r.description=desc;r.time=document.getElementById("mTime")?.value||"";r.steps=steps;r.runs=Array.isArray(r.runs)?r.runs:[];if(type==="new-routine")db.routines.unshift(r);persist();closeModal();toast(t("saved"));render();return}if(type==="edit-money"||type==="new-money"){const amount=Numb {id,title,description:desc,progress:Number(document.getElementById("mProgress")?.value||0),deadline:document.getElementById("mDeadline")?.value||""});}else if(type==="new-project"){db.projects.unshift({id,title,description:desc,status:"planned",progress:0});state.selectedProject=id;}else if(type==="new-note")db.notes.unshift({id,title,description:desc});else if(type==="new-habit"){const start=habitDate(new Date());db.habits.unshift({id,title,description:desc,frequency:document.getElementById("mFrequency")?.value||"daily",reminder:document.getElementById("mHabitReminder")?.value||"",startDate:start,completions:[],streak:0,lastDone:""});}else if(type==="new-journal")db.journal.unshift({id,date:new Date().toLocaleDateString(),description:desc||title});else if(type==="new-routine")db.routines.unshift({id,title,description:desc,time:document.getElementById("mTime")?.value||""});persist();closeModal();toast(t("saved"));render()}
